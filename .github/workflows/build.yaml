name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  discover-packages:
    name: Discover Dart packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart stable
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build package and SDK matrix
        id: packages
        run: |
          matrix=$(dart run .build/bin/list_libraries.dart .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  checks:
    name: "Verify ${{ matrix.package }} (Dart ${{ matrix.sdk }})"
    needs: discover-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-packages.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart ${{ matrix.sdk }}
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Run tests
        run: dart test

      - name: Run analyzer
        run: dart analyze --fatal-infos

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
